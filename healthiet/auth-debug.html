<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debug</title>
    <script src="js/clientLogger.js"></script>
    <script src="js/auth.js"></script>
</head>
<body>
    <h1>Authentication Debug</h1>
    
    <div id="auth-status">
        <h2>Authentication Status</h2>
        <p>Is Authenticated: <span id="isAuth">false</span></p>
        <p>User Role: <span id="userRole">none</span></p>
        <p>Token: <span id="token">none</span></p>
        <div id="userObject">
            <h3>Full User Object:</h3>
            <pre id="userJson">none</pre>
        </div>
    </div>

    <div id="login-section">
        <h2>Quick Admin Login</h2>
        <form id="debugLoginForm">
            <input type="email" name="email" value="admin@healthiet.com" placeholder="Email" required>
            <input type="password" name="password" value="adminpassword123" placeholder="Password" required>
            <button type="submit">Login as Admin</button>
        </form>
    </div>

    <div id="actions">
        <h2>Actions</h2>
        <button onclick="checkAuth()">Refresh Auth Status</button>
        <button onclick="testAdminAccess()">Test Admin Access</button>
        <button onclick="window.authManager.logout()">Logout</button>
    </div>

    <div id="results">
        <h2>Test Results</h2>
        <div id="output"></div>
    </div>

    <script>
        window.authManager = new AuthManager();
        
        function checkAuth() {
            const isAuth = window.authManager.isAuthenticated();
            const userRole = window.authManager.getUserRole();
            const token = window.authManager.getToken();
            const user = window.authManager.getUser();
            
            document.getElementById('isAuth').textContent = isAuth;
            document.getElementById('userRole').textContent = userRole || 'none';
            document.getElementById('token').textContent = token ? 'present' : 'none';
            document.getElementById('userJson').textContent = JSON.stringify(user, null, 2);
        }
        
        function testAdminAccess() {
            const result = window.authManager.requireAuth('Admin');
            document.getElementById('output').innerHTML += 
                `<p>Admin access test: ${result ? 'PASSED' : 'FAILED'}</p>`;
        }
        
        // Initialize debug login form
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            
            // Setup login form
            window.authManager.initLoginForm('#debugLoginForm');
            
            // Add custom login handler to refresh status after login
            const form = document.getElementById('debugLoginForm');
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = this.querySelector('[name="email"]').value;
                const password = this.querySelector('[name="password"]').value;
                
                try {
                    const result = await window.authManager.login(email, password);
                    console.log('Login result:', result);
                    
                    if (result.success) {
                        document.getElementById('output').innerHTML += 
                            `<p style="color: green;">Login successful!</p>`;
                        setTimeout(checkAuth, 100); // Refresh status after login
                    } else {
                        document.getElementById('output').innerHTML += 
                            `<p style="color: red;">Login failed: ${result.message}</p>`;
                    }
                } catch (error) {
                    document.getElementById('output').innerHTML += 
                        `<p style="color: red;">Login error: ${error.message}</p>`;
                }
            });
        });
    </script>
</body>
<!--#include file="components/universal-footer.html" -->
</html>
