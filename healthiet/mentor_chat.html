<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Mentees - Healthiet</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/globalAuth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        :root {
            --primary-color: #0a7e7a;
            --primary-light: #0dc9c2;
            --primary-lighter: #e0f7f6;
            --dark-color: #2c3e50;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --border-color: #dde2e7;
            --border-radius: 16px;
            --box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark-color);
            min-height: 100vh;
        }

        .chat-container {
            max-width: 1200px;
            margin: 20px auto;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            height: calc(100vh - 40px);
            display: flex;
        }

        .mentees-sidebar {
            width: 300px;
            background: var(--light-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            background: var(--primary-color);
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mentees-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .mentee-item {
            padding: 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .mentee-item:hover,
        .mentee-item.active {
            background: white;
            border-left: 4px solid var(--primary-color);
        }

        .mentee-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-light);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .mentee-info h4 {
            margin: 0;
            font-size: 1rem;
            color: var(--dark-color);
        }

        .mentee-info p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--gray-color);
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: var(--primary-color);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .selected-mentee-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .selected-mentee-info h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .selected-mentee-info p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: var(--transition);
            margin-left: auto;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            flex-direction: row-reverse;
        }

        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            position: relative;
        }

        .message.received .message-bubble {
            background: white;
            border: 1px solid var(--border-color);
        }

        .message.sent .message-bubble {
            background: var(--primary-color);
            color: white;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--gray-color);
            margin-top: 0.25rem;
        }

        .message.sent .message-time {
            color: rgba(255, 255, 255, 0.8);
        }

        .chat-input {
            padding: 1rem;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        .chat-input input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
        }

        .chat-input input:focus {
            border-color: var(--primary-color);
        }

        .send-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .send-btn:hover {
            background: var(--primary-light);
        }

        .empty-chat {
            text-align: center;
            padding: 3rem;
            color: var(--gray-color);
        }

        .empty-chat i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-light);
        }

        .no-mentees {
            text-align: center;
            padding: 2rem;
            color: var(--gray-color);
        }

        .selected-mentee-info {
            position: relative;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
            position: absolute;
            top: 5px;
            right: 5px;
            transition: background-color 0.3s ease;
        }

        @media (max-width: 768px) {
            .chat-container {
                margin: 0;
                height: 100vh;
                border-radius: 0;
            }

            .mentees-sidebar {
                width: 100%;
                position: absolute;
                z-index: 10;
                height: 100%;
                transform: translateX(-100%);
                transition: var(--transition);
            }

            .mentees-sidebar.open {
                transform: translateX(0);
            }

            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="mentees-sidebar" id="menteesSidebar">
            <div class="sidebar-header">
                <i class="bi bi-people"></i>
                <h3>My Mentees</h3>
            </div>
            <div class="mentees-list" id="menteesList">
                <div class="no-mentees">
                    <i class="bi bi-people"></i>
                    <p>Loading mentees...</p>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="selected-mentee-avatar" id="selectedMenteeAvatar">
                    <i class="bi bi-chat-dots"></i>
                </div>
                <div class="selected-mentee-info">
                    <h3 id="selectedMenteeName">Select a mentee to start chatting</h3>
                    <p id="selectedMenteeEmail">Choose from your mentees list</p>
                     </div>
                <button class="back-btn" onclick="goBack()" title="Go back to dashboard">
                    <i class="bi bi-arrow-left"></i>
                </button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat">
                    <i class="bi bi-chat-text"></i>
                    <h3>Welcome to Mentor Chat</h3>
                    <p>Select a mentee from the sidebar to start a conversation</p>
                </div>
            </div>

            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)" disabled>
                <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled title="Send message">
                    <i class="bi bi-send"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let mentees = [];
        let selectedMenteeId = null;
        let messagePollingInterval = null;
        let lastMessageCount = 0;

        // Initialize chat
        document.addEventListener('DOMContentLoaded', async function() {
            // Check authentication
            if (!window.isLoggedIn || !window.isLoggedIn()) {
                window.location.href = 'auth.html';
                return;
            }

            const userRole = window.getUserRole();
            if (userRole !== 'Mentor') {
                alert('Only mentors can access this chat.');
                window.location.href = 'mentor_dashboard.html';
                return;
            }

            await loadMentees();
            
            // Add console message for debugging
            console.log('Mentor chat initialized - auto-reload will start when mentee is selected');
        });

        async function loadMentees() {
            try {
                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                const response = await fetch('/api/users/my-mentees', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (data.success && data.mentees) {
                    mentees = data.mentees;
                    renderMenteesList();
                } else {
                    document.getElementById('menteesList').innerHTML = `
                        <div class="no-mentees">
                            <i class="bi bi-people"></i>
                            <p>No mentees assigned yet</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading mentees:', error);
                document.getElementById('menteesList').innerHTML = `
                    <div class="no-mentees">
                        <i class="bi bi-exclamation-triangle"></i>
                        <p>Failed to load mentees</p>
                    </div>
                `;
            }
        }

        function renderMenteesList() {
            const menteesList = document.getElementById('menteesList');
            
            if (mentees.length === 0) {
                menteesList.innerHTML = `
                    <div class="no-mentees">
                        <i class="bi bi-people"></i>
                        <p>No mentees assigned yet</p>
                    </div>
                `;
                return;
            }

            menteesList.innerHTML = '';
            
            mentees.forEach(mentee => {
                const menteeElement = document.createElement('div');
                menteeElement.className = 'mentee-item';
                menteeElement.onclick = () => selectMentee(mentee);
                
                const initials = `${mentee.firstName?.charAt(0) || ''}${mentee.lastName?.charAt(0) || ''}`.toUpperCase() || mentee.email.charAt(0).toUpperCase();
                
                menteeElement.innerHTML = `
                    <div class="mentee-avatar">${initials}</div>
                    <div class="mentee-info">
                        <h4>${mentee.firstName || ''} ${mentee.lastName || ''}</h4>
                        <p>${mentee.email}</p>
                    </div>
                `;
                
                menteesList.appendChild(menteeElement);
            });
        }

        function selectMentee(mentee) {
            selectedMenteeId = mentee._id;
            lastMessageCount = 0; // Reset message count for new conversation
            
            // Update active state
            document.querySelectorAll('.mentee-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // Update chat header
            const initials = `${mentee.firstName?.charAt(0) || ''}${mentee.lastName?.charAt(0) || ''}`.toUpperCase() || mentee.email.charAt(0).toUpperCase();
            document.getElementById('selectedMenteeAvatar').textContent = initials;
            document.getElementById('selectedMenteeName').textContent = `${mentee.firstName || ''} ${mentee.lastName || ''}`.trim() || 'Mentee';
            document.getElementById('selectedMenteeEmail').textContent = mentee.email;
            
            // Show status indicator
            const statusIndicator = document.querySelector('.status-indicator');
            if (statusIndicator) {
                statusIndicator.style.display = 'block';
            }
            
            // Enable input
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            
            // Load chat history
            loadChatHistory();
            
            // Start polling for messages
            if (messagePollingInterval) {
                clearInterval(messagePollingInterval);
            }
            startMessagePolling();
        }

        async function loadChatHistory() {
            if (!selectedMenteeId) return;

            try {
                updatePollingStatus('loading');

                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                const response = await fetch(`/api/chat/history/${selectedMenteeId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (data.success && data.messages) {
                    displayMessages(data.messages);
                    updatePollingStatus('active');
                } else {
                    updatePollingStatus('error');
                    setTimeout(() => updatePollingStatus('active'), 2000);
                }
            } catch (error) {
                console.error('Error loading chat history:', error);
                updatePollingStatus('error');
                setTimeout(() => updatePollingStatus('active'), 2000);
                // Don't show error alerts during auto-refresh to avoid spam
            }
        }

        function displayMessages(messages) {
            const chatMessages = document.getElementById('chatMessages');
            
            if (messages.length === 0) {
                if (chatMessages.children.length === 0 || !chatMessages.innerHTML.includes('empty-chat')) {
                    chatMessages.innerHTML = `
                        <div class="empty-chat">
                            <i class="bi bi-chat-dots"></i>
                            <h3>Start the conversation</h3>
                            <p>Send a message to your mentee to get started!</p>
                        </div>
                    `;
                }
                lastMessageCount = 0;
                return;
            }

            // Performance optimization: Only update if message count has changed
            if (messages.length === lastMessageCount && chatMessages.children.length > 0) {
                return;
            }

            // Check if user is scrolled to bottom before updating
            const isScrolledToBottom = chatMessages.scrollHeight - chatMessages.clientHeight <= chatMessages.scrollTop + 1;
            
            // Store if this is a new message (for visual feedback and notifications)
            const hasNewMessages = messages.length > lastMessageCount;
            const newMessageCount = hasNewMessages ? messages.length - lastMessageCount : 0;

            // Only rebuild DOM if significant changes or first load
            if (lastMessageCount === 0 || newMessageCount > 5) {
                chatMessages.innerHTML = '';
                messages.forEach((message, index) => {
                    appendMessage(message, false);
                });
            } else if (hasNewMessages) {
                // Only append new messages for better performance
                for (let i = lastMessageCount; i < messages.length; i++) {
                    appendMessage(messages[i], true);
                }
            }

            lastMessageCount = messages.length;

            // Auto-scroll behavior
            if (isScrolledToBottom || hasNewMessages) {
                setTimeout(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 100);
            }
            
            // Notification for new messages from mentee
            if (hasNewMessages && messages.length > 0) {
                const lastMessage = messages[messages.length - 1];
                const lastMessageSenderId = lastMessage.sender?._id || lastMessage.sender;
                const currentUserId = window.getUserId();
                
                if (lastMessageSenderId !== currentUserId) {
                    // Show notification only if tab is hidden or inactive
                    if (document.hidden) {
                        document.title = `💬 ${newMessageCount} New Message${newMessageCount > 1 ? 's' : ''} - Chat - Healthiet`;
                    } else {
                        // Brief title flash for active tab
                        document.title = '💬 New Message - Chat with Mentees - Healthiet';
                        setTimeout(() => {
                            document.title = 'Chat with Mentees - Healthiet';
                        }, 2000);
                    }
                }
            }
        }

        function appendMessage(message, isNew = false) {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            const senderId = message.sender?._id || message.sender;
            const currentUserId = window.getUserId();
            
            messageElement.className = `message ${senderId === currentUserId ? 'sent' : 'received'}`;
            
            // Add animation for new messages during auto-reload
            if (isNew) {
                messageElement.style.animation = 'fadeInUp 0.3s ease-out';
            }
            
            const time = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageElement.innerHTML = `
                <div class="message-bubble">
                    <div>${escapeHtml(message.message)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            chatMessages.appendChild(messageElement);
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message || !selectedMenteeId) return;

            try {
                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        receiver: selectedMenteeId,
                        message: message
                    })
                });

                const data = await response.json();
                if (data.success) {
                    messageInput.value = '';
                    await loadChatHistory(); // Refresh chat
                } else {
                    alert('Failed to send message. Please try again.');
                }
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message. Please try again.');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function startMessagePolling() {
            // Clear any existing interval
            if (messagePollingInterval) {
                clearInterval(messagePollingInterval);
            }
            
            let pollInterval = 1000; // Start with 1 second
            let consecutiveNoChanges = 0;
            const maxInterval = 10000; // Max 10 seconds between polls
            
            function poll() {
                // Only poll if tab is visible/active
                if (document.hidden) {
                    setTimeout(poll, pollInterval);
                    return;
                }
                
                loadChatHistory()
                    .then(() => {
                        // Reset interval if we got new messages
                        if (lastMessageCount > 0) {
                            consecutiveNoChanges = 0;
                            pollInterval = 1000;
                        } else {
                            consecutiveNoChanges++;
                            // Gradually increase interval if no new messages
                            if (consecutiveNoChanges > 10) {
                                pollInterval = Math.min(pollInterval * 1.2, maxInterval);
                            }
                        }
                        
                        // Update status indicator
                        updatePollingStatus('active');
                        
                        // Schedule next poll
                        messagePollingInterval = setTimeout(poll, pollInterval);
                    })
                    .catch(error => {
                        console.error('Message polling error:', error);
                        updatePollingStatus('error');
                        
                        // Increase interval on error, but try again
                        pollInterval = Math.min(pollInterval * 1.5, maxInterval);
                        messagePollingInterval = setTimeout(poll, pollInterval);
                    });
            }
            
            // Start polling
            poll();
            console.log('Smart message auto-reload started');
        }
        
        function updatePollingStatus(status) {
            const statusIndicator = document.querySelector('.status-indicator');
            if (!statusIndicator) return;
            
            statusIndicator.style.display = 'block';
            
            switch(status) {
                case 'active':
                    statusIndicator.style.background = '#28a745'; // Green
                    statusIndicator.title = 'Auto-reload active';
                    break;
                case 'error':
                    statusIndicator.style.background = '#dc3545'; // Red
                    statusIndicator.title = 'Connection error - retrying';
                    break;
                case 'loading':
                    statusIndicator.style.background = '#ffc107'; // Yellow
                    statusIndicator.title = 'Loading messages...';
                    break;
            }
        }

        function goBack() {
            if (messagePollingInterval) {
                clearTimeout(messagePollingInterval);
                messagePollingInterval = null;
            }
            window.location.href = 'mentor_dashboard.html';
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (messagePollingInterval) {
                clearTimeout(messagePollingInterval);
            }
        });

        // Pause polling when tab is hidden, resume when visible
        document.addEventListener('visibilitychange', function() {
            if (selectedMenteeId) {
                if (document.hidden) {
                    console.log('Tab hidden - pausing auto-reload');
                } else {
                    console.log('Tab visible - resuming auto-reload');
                    // Immediately check for new messages when tab becomes visible
                    if (messagePollingInterval) {
                        clearTimeout(messagePollingInterval);
                        startMessagePolling();
                    }
                }
            }
        });
    </script>
</body>
<!--#include file="components/universal-footer.html" -->
</html>
