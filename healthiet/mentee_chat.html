<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Mentor - Healthiet</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/globalAuth.js"></script>
    <script src="js/authInit.js"></script>
    <script src="js/clientLogger.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        :root {
            --primary-color: #0a7e7a;
            --primary-light: #0dc9c2;
            --primary-lighter: #e0f7f6;
            --dark-color: #2c3e50;
            --light-color: #f8f9fa;
            --gray-color: #6c757d;
            --border-color: #dde2e7;
            --border-radius: 16px;
            --box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--dark-color);
            min-height: 100vh;
        }

        .chat-container {
            max-width: 1000px;
            margin: 20px auto;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            overflow: hidden;
            height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: var(--primary-color);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .mentor-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .mentor-info h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .mentor-info p {
            margin: 0;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: var(--transition);
            margin-left: auto;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            animation: fadeInUp 0.3s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            flex-direction: row-reverse;
        }

        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 18px;
            position: relative;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            word-wrap: break-word;
        }

        .message.received .message-bubble {
            background: white;
            border: 1px solid var(--border-color);
        }

        .message.sent .message-bubble {
            background: var(--primary-color);
            color: white;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--gray-color);
            margin-top: 0.25rem;
            text-align: right;
        }

        .message.sent .message-time {
            color: rgba(255, 255, 255, 0.8);
        }

        .message.received .message-time {
            text-align: left;
        }

        .chat-input {
            padding: 1rem;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 1rem;
        }

        .chat-input input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            transition: var(--transition);
            background: var(--light-color);
        }

        .chat-input input:focus {
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 3px rgba(10, 126, 122, 0.1);
        }

        .send-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(10, 126, 122, 0.3);
        }

        .send-btn:hover {
            background: var(--primary-light);
            transform: scale(1.05);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-chat {
            text-align: center;
            padding: 3rem;
            color: var(--gray-color);
        }

        .empty-chat i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-light);
        }

        .typing-indicator {
            display: none;
            padding: 0.5rem 1rem;
            color: var(--gray-color);
            font-style: italic;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
            position: absolute;
            top: 5px;
            right: 5px;
            transition: background-color 0.3s ease;
        }

        .mentor-info {
            position: relative;
        }

        @media (max-width: 768px) {
            .chat-container {
                margin: 0;
                height: 100vh;
                border-radius: 0;
            }

            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="mentor-avatar" id="mentorAvatar">
                <i class="bi bi-person-badge"></i>
            </div>
            <div class="mentor-info">
                <h3 id="mentorName">Loading...</h3>
                <p id="mentorSpecialty">Health & Wellness Coach</p>
                <div class="status-indicator" title="Auto-reload active"></div>
            </div>
            <button class="back-btn" onclick="goBack()" title="Go back to dashboard">
                <i class="bi bi-arrow-left"></i>
            </button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="empty-chat">
                <i class="bi bi-chat-dots"></i>
                <h3>Start a conversation</h3>
                <p>Send a message to your mentor to get started!</p>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            Your mentor is typing...
        </div>

        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()" id="sendBtn" title="Send message">
                <i class="bi bi-send"></i>
            </button>
        </div>
    </div>

    <script>
        let mentorId = null;
        let mentorData = null;
        let messagePollingInterval = null;
        let lastMessageCount = 0;

        // Initialize chat
        document.addEventListener('DOMContentLoaded', async function() {
            // Check authentication
            if (!window.isLoggedIn || !window.isLoggedIn()) {
                window.location.href = 'auth.html';
                return;
            }

            const userRole = window.getUserRole();
            if (userRole !== 'Mentee') {
                alert('Only mentees can access this chat.');
                window.location.href = 'mentee_dashboard.html';
                return;
            }

            await loadMentorInfo();
            await loadChatHistory();
            
            // Start polling for new messages
            startMessagePolling();
            
            // Add console message for debugging
            console.log('Chat initialized with auto-reload enabled');
        });

        async function loadMentorInfo() {
            try {
                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                const response = await fetch('/api/users/my-mentor', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (data.success && data.mentor) {
                    mentorData = data.mentor;
                    mentorId = data.mentor._id;
                    
                    // Update UI
                    document.getElementById('mentorName').textContent = 
                        `${data.mentor.firstName || ''} ${data.mentor.lastName || ''}`.trim() || 'Your Mentor';
                    document.getElementById('mentorSpecialty').textContent = 
                        Array.isArray(data.mentor.specialty) ? data.mentor.specialty.join(', ') : 'Health & Wellness Coach';
                    
                    const avatar = document.getElementById('mentorAvatar');
                    if (data.mentor.profilePhotoUrl) {
                        avatar.innerHTML = `<img src="${data.mentor.profilePhotoUrl}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                    } else {
                        const initials = `${data.mentor.firstName?.charAt(0) || ''}${data.mentor.lastName?.charAt(0) || ''}`.toUpperCase() || 'M';
                        avatar.textContent = initials;
                    }
                } else {
                    alert('You don\'t have an assigned mentor yet. Please assign a mentor first.');
                    window.location.href = 'mentee_dashboard.html';
                }
            } catch (error) {
                console.error('Error loading mentor info:', error);
                alert('Failed to load mentor information.');
                window.location.href = 'mentee_dashboard.html';
            }
        }

        async function loadChatHistory() {
            if (!mentorId) return;

            try {
                // Add subtle loading indicator
                const statusIndicator = document.querySelector('.status-indicator');
                if (statusIndicator) {
                    statusIndicator.style.background = '#ffc107'; // Yellow for loading
                }

                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                const response = await fetch(`/api/chat/history/${mentorId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (data.success && data.messages) {
                    displayMessages(data.messages);
                    
                    // Update status indicator to show success
                    if (statusIndicator) {
                        statusIndicator.style.background = '#28a745'; // Green for success
                    }
                } else {
                    if (statusIndicator) {
                        statusIndicator.style.background = '#dc3545'; // Red for error
                        setTimeout(() => {
                            statusIndicator.style.background = '#28a745';
                        }, 2000);
                    }
                }
            } catch (error) {
                console.error('Error loading chat history:', error);
                
                // Update status indicator to show error
                const statusIndicator = document.querySelector('.status-indicator');
                if (statusIndicator) {
                    statusIndicator.style.background = '#dc3545'; // Red for error
                    setTimeout(() => {
                        statusIndicator.style.background = '#28a745';
                    }, 2000);
                }
                // Don't show error alerts during auto-refresh to avoid spam
            }
        }

        function displayMessages(messages) {
            const chatMessages = document.getElementById('chatMessages');
            
            if (messages.length === 0) {
                chatMessages.innerHTML = `
                    <div class="empty-chat">
                        <i class="bi bi-chat-dots"></i>
                        <h3>Start a conversation</h3>
                        <p>Send a message to your mentor to get started!</p>
                    </div>
                `;
                lastMessageCount = 0;
                return;
            }

            // Only update if message count has changed to reduce unnecessary DOM updates
            if (messages.length === lastMessageCount && chatMessages.children.length > 0) {
                return;
            }

            // Check if user is scrolled to bottom before updating
            const isScrolledToBottom = chatMessages.scrollHeight - chatMessages.clientHeight <= chatMessages.scrollTop + 1;
            
            // Store if this is a new message (for visual feedback)
            const hasNewMessages = messages.length > lastMessageCount;

            chatMessages.innerHTML = '';
            const currentUserId = window.getUserId();

            messages.forEach((message, index) => {
                const messageElement = document.createElement('div');
                const senderId = message.sender?._id || message.sender;
                messageElement.className = `message ${senderId === currentUserId ? 'sent' : 'received'}`;
                
                // Add animation for new messages
                if (hasNewMessages && index >= lastMessageCount) {
                    messageElement.style.animation = 'fadeInUp 0.3s ease-out';
                }
                
                const time = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                messageElement.innerHTML = `
                    <div class="message-bubble">
                        <div>${escapeHtml(message.message)}</div>
                        <div class="message-time">${time}</div>
                    </div>
                `;
                
                chatMessages.appendChild(messageElement);
            });

            lastMessageCount = messages.length;

            // Only auto-scroll if user was already at the bottom or if there are new messages
            if (isScrolledToBottom || hasNewMessages) {
                setTimeout(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 100);
            }
            
            // Show brief notification for new messages from mentor
            if (hasNewMessages && messages.length > 0) {
                const lastMessage = messages[messages.length - 1];
                const lastMessageSenderId = lastMessage.sender?._id || lastMessage.sender;
                if (lastMessageSenderId !== currentUserId) {
                    // Briefly highlight the browser tab or show subtle notification
                    document.title = '💬 New Message - Chat with Mentor - Healthiet';
                    setTimeout(() => {
                        document.title = 'Chat with Mentor - Healthiet';
                    }, 3000);
                }
            }
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = messageInput.value.trim();
            
            if (!message || !mentorId) return;

            // Disable send button while sending
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="bi bi-arrow-clockwise"></i>';

            try {
                const token = localStorage.getItem('authToken') || localStorage.getItem('token');
                const response = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        receiver: mentorId,
                        message: message
                    })
                });

                const data = await response.json();
                if (data.success) {
                    messageInput.value = '';
                    await loadChatHistory(); // Refresh chat
                    
                    // Brief success indicator
                    sendBtn.innerHTML = '<i class="bi bi-check"></i>';
                    setTimeout(() => {
                        sendBtn.innerHTML = '<i class="bi bi-send"></i>';
                    }, 1000);
                } else {
                    alert('Failed to send message: ' + (data.error || 'Please try again.'));
                }
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message. Please check your connection and try again.');
            } finally {
                // Re-enable send button
                sendBtn.disabled = false;
                if (sendBtn.innerHTML.includes('arrow-clockwise')) {
                    sendBtn.innerHTML = '<i class="bi bi-send"></i>';
                }
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function startMessagePolling() {
            // Clear any existing interval
            if (messagePollingInterval) {
                clearInterval(messagePollingInterval);
            }
            
            let pollInterval = 1000; // Start with 1 second
            let consecutiveNoChanges = 0;
            const maxInterval = 10000; // Max 10 seconds between polls
            
            function poll() {
                // Only poll if tab is visible/active
                if (document.hidden) {
                    setTimeout(poll, pollInterval);
                    return;
                }
                
                loadChatHistory()
                    .then(() => {
                        // Reset interval if we got new messages
                        if (lastMessageCount > 0) {
                            consecutiveNoChanges = 0;
                            pollInterval = 1000;
                        } else {
                            consecutiveNoChanges++;
                            // Gradually increase interval if no new messages
                            if (consecutiveNoChanges > 10) {
                                pollInterval = Math.min(pollInterval * 1.2, maxInterval);
                            }
                        }
                        
                        // Update status indicator
                        updatePollingStatus('active');
                        
                        // Schedule next poll
                        messagePollingInterval = setTimeout(poll, pollInterval);
                    })
                    .catch(error => {
                        console.error('Message polling error:', error);
                        updatePollingStatus('error');
                        
                        // Increase interval on error, but try again
                        pollInterval = Math.min(pollInterval * 1.5, maxInterval);
                        messagePollingInterval = setTimeout(poll, pollInterval);
                    });
            }
            
            // Start polling
            poll();
            console.log('Smart message auto-reload started');
        }
        
        function updatePollingStatus(status) {
            const statusIndicator = document.querySelector('.status-indicator');
            if (!statusIndicator) return;
            
            statusIndicator.style.display = 'block';
            
            switch(status) {
                case 'active':
                    statusIndicator.style.background = '#28a745'; // Green
                    statusIndicator.title = 'Auto-reload active';
                    break;
                case 'error':
                    statusIndicator.style.background = '#dc3545'; // Red
                    statusIndicator.title = 'Connection error - retrying';
                    break;
                case 'loading':
                    statusIndicator.style.background = '#ffc107'; // Yellow
                    statusIndicator.title = 'Loading messages...';
                    break;
            }
        }

        function goBack() {
            if (messagePollingInterval) {
                clearInterval(messagePollingInterval);
            }
            window.location.href = 'mentee_dashboard.html';
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (messagePollingInterval) {
                clearInterval(messagePollingInterval);
            }
        });
    </script>
</body>

</html>
