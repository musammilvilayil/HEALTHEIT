<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management - Healthiet</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Centralized Authentication System -->
    <script src="js/clientLogger.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Initialize auth manager early
        window.authManager = new AuthManager();
    </script>
    <style>
        :root {
            --primary-color: #126663;
            --secondary-color: #0dc9c2;
            --light-gray: #f0f0f0;
            --medium-gray: #d3d3d3;
            --dark-gray: #666;
            --text-color: #333;
            --white: #fff;
            --shadow-light: rgba(18,102,99,0.08);
            --shadow-medium: rgba(18,102,99,0.15);
            --shadow-strong: rgba(18,102,99,0.25);
            --error-color: #e74c3c;
            --success-color: #2ecc71;
            --warning-color: #f39c12;
            --accent-color: #9b59b6;
            --primary-light: rgba(18, 102, 99, 0.15);
            --light-bg: #f9f9f9;
            --border-radius: 12px;
            --box-shadow: 0 4px 12px var(--shadow-light);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: var(--light-bg);
            color: var(--text-color);
        }

        .sidebar {
            width: 250px;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            z-index: 100;
            transition: var(--transition);
        }

        .sidebar h2 {
            margin: 0 0 25px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar h2 i {
            font-size: 28px;
        }

        .sidebar .sidebar-link {
            color: white;
            text-decoration: none;
            margin: 8px 0;
            padding: 12px 15px;
            border-radius: var(--border-radius);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .sidebar .sidebar-link i {
            font-size: 18px;
        }

        .sidebar .sidebar-link.active, .sidebar .sidebar-link:hover {
            background-color: var(--primary-light);
        }

        .main-content {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            background-color: var(--light-bg);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--medium-gray);
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--dark-gray);
        }

        .recipe-management-section {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 30px;
            margin-bottom: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--dark-gray);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        .search-filter-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 1px solid var(--medium-gray);
            border-radius: 8px;
            font-size: 14px;
        }

        .filter-select {
            padding: 12px 15px;
            border: 1px solid var(--medium-gray);
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .recipe-card {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
            transition: var(--transition);
            border: 1px solid var(--light-gray);
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-medium);
        }

        .recipe-image {
            width: 100%;
            height: 200px;
            background-color: var(--light-gray);
            background-image: url('imgs/recipe-placeholder.png');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-gray);
            font-size: 48px;
        }

        .recipe-content {
            padding: 20px;
        }

        .recipe-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .recipe-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--dark-gray);
            font-size: 14px;
        }

        .recipe-actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-secondary {
            background-color: var(--dark-gray);
            color: white;
        }

        .btn-secondary:hover {
            background-color: var(--text-color);
        }

        .btn-warning {
            background-color: var(--warning-color);
            color: white;
        }

        .btn-warning:hover {
            background-color: #e67e22;
        }

        .btn-danger {
            background-color: var(--error-color);
            color: white;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--dark-gray);
        }

        .empty-state i {
            font-size: 64px;
            margin-bottom: 20px;
            color: var(--medium-gray);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--dark-gray);
        }

        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 10px;
                height: auto;
            }
            .sidebar h2 {
                width: 100%;
                margin-bottom: 15px;
            }
            .sidebar .sidebar-link {
                margin: 5px;
                padding: 8px 12px;
                font-size: 14px;
            }
            .main-content {
                padding: 15px;
            }
            .search-filter-container {
                flex-direction: column;
            }
            .recipe-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i class="bi bi-speedometer2"></i> Admin Portal</h2>
        <a href="admin_portal.html" class="sidebar-link"><i class="bi bi-grid"></i> Dashboard</a>
        <a href="user_management.html" class="sidebar-link"><i class="bi bi-people"></i> User Management</a>
        <a href="mentor_management.html" class="sidebar-link"><i class="bi bi-person-badge"></i> Mentor Management</a>
        <a href="mentor_applications.html" class="sidebar-link"><i class="bi bi-file-earmark-text"></i> Mentor Applications</a>
        <a href="recipe_management.html" class="sidebar-link active"><i class="bi bi-journal-text"></i> Recipe Management</a>
        <button class="sidebar-link" style="margin-top:20px;" data-action="logout"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
    
    <div class="main-content">
        <div class="dashboard-header">
            <div>
                <h1><i class="bi bi-journal-text"></i> Recipe Management</h1>
                <p>Manage healthy recipes and meal plans</p>
            </div>
        </div>
        
        <div class="recipe-management-section">
            <div class="section-header">
                <div class="section-title">
                    <i class="bi bi-collection"></i> Recipes Library
                </div>
                <button class="btn btn-primary" id="addRecipeBtn">
                    <i class="bi bi-plus-circle"></i> Add Recipe
                </button>
            </div>
            
            <div class="search-filter-container">
                <input type="text" class="search-box" id="searchInput" placeholder="Search recipes by name or ingredients...">
                <select class="filter-select" id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                    <option value="snacks">Snacks</option>
                    <option value="desserts">Desserts</option>
                </select>
                <select class="filter-select" id="difficultyFilter">
                    <option value="all">All Difficulties</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            
            <div id="recipeGrid" class="recipe-grid">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Loading recipes...
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample recipe data (replace with API calls)
        let recipesData = [
            {
                id: 1,
                title: "Quinoa Buddha Bowl",
                category: "lunch",
                difficulty: "easy",
                prepTime: "30 mins",
                servings: 4,
                image: "imgs/quinoa-bowl.jpg"
            },
            {
                id: 2,
                title: "Overnight Oats",
                category: "breakfast",
                difficulty: "easy",
                prepTime: "5 mins",
                servings: 1,
                image: "imgs/overnight-oats.jpg"
            },
            {
                id: 3,
                title: "Grilled Salmon",
                category: "dinner",
                difficulty: "medium",
                prepTime: "45 mins",
                servings: 2,
                image: "imgs/grilled-salmon.jpg"
            }
        ];

        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        const difficultyFilter = document.getElementById('difficultyFilter');
        const recipeGrid = document.getElementById('recipeGrid');
        const addRecipeBtn = document.getElementById('addRecipeBtn');

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Recipe management loading - checking authentication...');
            
            // Check if user is authenticated and has admin role
            if (!window.authManager.requireAuth('Admin')) {
                console.log('Admin authentication failed, redirecting...');
                return; // requireAuth will handle the redirect
            }
            
            console.log('Admin authentication successful');
            
            renderRecipes(recipesData);
            setupEventListeners();
            setupLogout();
        });

        function setupEventListeners() {
            searchInput.addEventListener('input', filterRecipes);
            categoryFilter.addEventListener('change', filterRecipes);
            difficultyFilter.addEventListener('change', filterRecipes);
            addRecipeBtn.addEventListener('click', showAddRecipeModal);
        }

        function renderRecipes(recipes) {
            if (recipes.length === 0) {
                recipeGrid.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-journal-x"></i>
                        <h3>No recipes found</h3>
                        <p>Try adjusting your search or add a new recipe.</p>
                    </div>
                `;
                return;
            }

            recipeGrid.innerHTML = recipes.map(recipe => `
                <div class="recipe-card">
                    <div class="recipe-image">
                        <i class="bi bi-image"></i>
                    </div>
                    <div class="recipe-content">
                        <h3 class="recipe-title">${recipe.title}</h3>
                        <div class="recipe-meta">
                            <span><i class="bi bi-clock"></i> ${recipe.prepTime}</span>
                            <span><i class="bi bi-people"></i> ${recipe.servings} servings</span>
                        </div>
                        <div class="recipe-actions">
                            <button class="btn btn-secondary btn-sm" onclick="viewRecipe(${recipe.id})">
                                <i class="bi bi-eye"></i> View
                            </button>
                            <button class="btn btn-warning btn-sm" onclick="editRecipe(${recipe.id})">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deleteRecipe(${recipe.id})">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterRecipes() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCategory = categoryFilter.value;
            const selectedDifficulty = difficultyFilter.value;

            const filteredRecipes = recipesData.filter(recipe => {
                const matchesSearch = recipe.title.toLowerCase().includes(searchTerm);
                const matchesCategory = selectedCategory === 'all' || recipe.category === selectedCategory;
                const matchesDifficulty = selectedDifficulty === 'all' || recipe.difficulty === selectedDifficulty;
                
                return matchesSearch && matchesCategory && matchesDifficulty;
            });

            renderRecipes(filteredRecipes);
        }

        function viewRecipe(id) {
            const recipe = recipesData.find(r => r.id === id);
            alert(`Viewing recipe: ${recipe.title}\n(This would open a detailed view)`);
        }

        function editRecipe(id) {
            const recipe = recipesData.find(r => r.id === id);
            alert(`Editing recipe: ${recipe.title}\n(This would open an edit form)`);
        }

        function deleteRecipe(id) {
            const recipe = recipesData.find(r => r.id === id);
            if (confirm(`Are you sure you want to delete "${recipe.title}"?`)) {
                recipesData = recipesData.filter(r => r.id !== id);
                filterRecipes(); // Re-render with current filters
                alert('Recipe deleted successfully!');
            }
        }

        function showAddRecipeModal() {
            alert('Add Recipe form would open here\n(This would show a form to add a new recipe)');
        }

        function setupLogout() {
            const logoutBtn = document.querySelector('[data-action="logout"]');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', function() {
                    if (window.authManager && typeof window.authManager.logout === 'function') {
                        window.authManager.logout();
                    } else {
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('token');
                        window.location.href = 'auth.html';
                    }
                });
            }
        }
    </script>
</body>

</html>
